    <h1 class="sr-only">Class 10 ICSE RESOURCES</h1>
    <canvas id="constellation-bg" class="fixed inset-0 pointer-events-none z-[-1]"></canvas>
    <div id="root"></div>
    <script data-goatcounter="https://icse-resources1.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      const canvas = document.getElementById('constellation-bg');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const mouse = { x: null, y: null, radius: 150 };

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('mouseout', () => {
        mouse.x = null;
        mouse.y = null;
      });

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = (Math.random() - 0.5) * 0.8;
          this.size = Math.random() * 2 + 1;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > width) this.vx = -this.vx;
          if (this.y < 0 || this.y > height) this.vy = -this.vy;
        }
        draw(isDark) {
          /* Light mode: Indigo/Purple | Dark mode: Orange */
          ctx.fillStyle = isDark ? 'rgba(249, 115, 22, 0.85)' : 'rgba(79, 70, 229, 0.85)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const particles = Array.from({ length: 70 }, () => new Particle());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Detect theme state dynamically
        const isDark = document.documentElement.classList.contains('dark');

        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw(isDark);

          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 130) {
              const alpha = 1 - dist / 130;
              /* Light mode: Purple lines | Dark mode: Orange lines */
              ctx.strokeStyle = isDark 
                ? `rgba(249, 115, 22, ${0.45 * alpha})` 
                : `rgba(79, 70, 229, ${0.45 * alpha})`;
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }

          if (mouse.x !== null && mouse.y !== null) {
            const mdx = particles[i].x - mouse.x;
            const mdy = particles[i].y - mouse.y;
            const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mdist < mouse.radius) {
              const mAlpha = 1 - mdist / mouse.radius;
              /* Mouse interaction line colors */
              ctx.strokeStyle = isDark
                ? `rgba(251, 146, 60, ${0.65 * mAlpha})`
                : `rgba(234, 88, 12, ${0.65 * mAlpha})`;
              ctx.lineWidth = 0.9;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }

      animate();
    </script>
