<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>icse-resources1</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        /* Radial gradient: Pure white in center -> subtle soft gray (slate-200) at corners */
        background: radial-gradient(ellipse at center, #ffffff 40%, #cbd5e1 100%);
        background-attachment: fixed;
      }
    </style>
  </head>
  <body>
    <canvas id="constellation-bg" class="fixed inset-0 pointer-events-none z-[-1]"></canvas>
    <div id="root"></div>
    
    <script type="module" src="./src/main.tsx"></script>
    <script>
      const canvas = document.getElementById('constellation-bg');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const mouse = { x: null, y: null, radius: 150 };

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('mouseout', () => {
        mouse.x = null;
        mouse.y = null;
      });

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = (Math.random() - 0.5) * 0.8;
          this.size = Math.random() * 2 + 1;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > width) this.vx = -this.vx;
          if (this.y < 0 || this.y > height) this.vy = -this.vy;
        }
        draw() {
          ctx.fillStyle = 'rgba(79, 70, 229, 0.85)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const particles = Array.from({ length: 70 }, () => new Particle());

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();

          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 130) {
              ctx.strokeStyle = `rgba(79, 70, 229, ${0.45 * (1 - dist / 130)})`;
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }

          if (mouse.x !== null && mouse.y !== null) {
            const mdx = particles[i].x - mouse.x;
            const mdy = particles[i].y - mouse.y;
            const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mdist < mouse.radius) {
              ctx.strokeStyle = `rgba(234, 88, 12, ${0.65 * (1 - mdist / mouse.radius)})`;
              ctx.lineWidth = 0.9;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
