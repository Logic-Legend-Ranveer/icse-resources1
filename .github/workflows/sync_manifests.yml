name: Sync Manifests

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: Install Dependencies
        run: npm install

      - name: Recreate Google Drive Credentials
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_CREDENTIALS_2: ${{ secrets.GDRIVE_CREDENTIALS_2 }}
          GDRIVE_TOKEN_2: ${{ secrets.GDRIVE_TOKEN_2 }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          echo "$GDRIVE_TOKEN" > token.json
          
          # If Account 2 credentials exist, write them out
          if [ -n "$GDRIVE_CREDENTIALS_2" ]; then
            echo "$GDRIVE_CREDENTIALS_2" > credentials2.json
            echo "$GDRIVE_TOKEN_2" > token2.json
          fi

      - name: Run Manifest Generator
        run: |
          node generate_manifests.cjs

      - name: Update Cloudflare KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put known_ids --namespace-id "034aa09c40434d4ba0a1745218e80c84" --path known_ids.json --remote

      - name: Commit and Push Updated Manifests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync files from multiple Google Drive accounts and update manifests"
          file_pattern: "public/files.json public/quizzes.json"
