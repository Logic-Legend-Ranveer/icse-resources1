name: Sync Manifests

on:
  # Run automatically every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install Dependencies
        run: npm install

      - name: Recreate Google Drive Credentials
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          echo "$GDRIVE_TOKEN" > token.json

      - name: Run Manifest Generator
        run: |
          node generate_manifests.cjs

      - name: Update Cloudflare KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put known_ids --binding FILE_IDS --path known_ids.json --remote

      - name: Commit and Push Updated Manifests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync files from Google Drive and update manifests"
          # Only commit the public JSON files. credentials.json, token.json, and known_ids.json stay ignored!
          file_pattern: "public/files.json public/quizzes.json"
