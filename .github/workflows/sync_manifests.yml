name: Sync Manifests

on:
  # Run automatically every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install Dependencies
        run: npm install

      - name: Recreate Google Drive Credentials
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          echo "$GDRIVE_TOKEN" > token.json

      - name: Print Account Email
        run: |
          python3 -c "
          import requests, json
          with open('token.json') as f:
          token_data = json.load(f)
          refresh_token = token_data.get('refresh_token')
      
            # Get credentials json if needed, or read from credentials.json
          with open('credentials.json') as f:
            cred_data = json.load(f)
              # Handle installed or web app client structure
              client_info = cred_data.get('installed', cred_data.get('web', {}))
      
            res = requests.post('https://oauth2.googleapis.com/token', data={
          'client_id': client_info['client_id'],
            'client_secret': client_info['client_secret'],
            'refresh_token': refresh_token,
          'grant_type': 'refresh_token'
            }).json()
      
            access_token = res.get('access_token')
           if access_token:
              user = requests.get('https://www.googleapis.com/drive/v3/about?fields=user', 
                              headers={'Authorization': f'Bearer {access_token}'}).json()
                print('YOUR GOOGLE ACCOUNT EMAIL IS:', user.get('user', {}).get('emailAddress'))
              else:
            print('Error response:', res)
          "
   
      - name: Run Manifest Generator
        run: |
          node generate_manifests.cjs

      - name: Update Cloudflare KV Namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put known_ids --namespace-id "034aa09c40434d4ba0a1745218e80c84" --path known_ids.json --remote

      - name: Commit and Push Updated Manifests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync files from Google Drive and update manifests"
          # Only commit the public JSON files. credentials.json, token.json, and known_ids.json stay ignored!
          file_pattern: "public/files.json public/quizzes.json"
          - name: Debug Google Drive Tokens

